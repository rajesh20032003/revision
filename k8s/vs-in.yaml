apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: shop-vs-internal
  namespace: shop-dev
spec:
  gateways:
    - mesh
  hosts:
    - "deploy-app.shop-dev.svc.cluster.local"
  http:
    - name: primary
      match:
        - uri:
            prefix: /
      route:
        - destination:
            host: sm-svc-stable
            port:
              number: 80
          weight: 100
        - destination:
            host: sm-svc-canary
            port:
              number: 80
          weight: 0