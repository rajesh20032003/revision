apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: shop-bg-app
  namespace: shop-dev
spec:
  replicas: 3
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: my-bluegreen-app
  template:
    metadata:
      labels:
        app: my-bluegreen-app
    spec:
      containers:
        - name: web-app
          image: nginx:latest
          ports:
            - containerPort: 80
  strategy:
    blueGreen:
      activeService: shop-active-service
      previewService: shop-preview-service
      autoPromotionEnabled: true
      # 👇 Fixed: Changed previewAnalysis to prePromotionAnalysis
      prePromotionAnalysis:
        templates:
          - templateName: frontend-smoke-test
