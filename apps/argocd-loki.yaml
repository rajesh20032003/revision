apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: loki
    targetRevision: "6.14.0" # Hardcoding a stable v6.x major version is safer than using "*"
    helm:
      values: |
        deploymentMode: SimpleScalable
        loki:
          auth_enabled: false
          commonConfig:
            replication_factor: 1
          
          # CRITICAL FIX: Schema Configuration is mandatory for Loki v6+
          schemaConfig:
            configs:
              - from: "2024-04-01"
                object_store: s3
                store: tsdb
                schema: v13
                index:
                  prefix: index_
                  period: 24h

          storage:
            type: s3
            bucketNames:
              chunks: s3-loki-bucket-rajesh
              ruler: s3-loki-bucket-rajesh
              admin: s3-loki-bucket-rajesh
            s3:
              region: us-east-1
              s3ForcePathStyle: false
              # Direct reference to your generated generic secret keys
              secretName: loki-s3-secret
        
        # Scaling components down for efficient resource allocation
        read:
          replicas: 1
        write:
          replicas: 1
        backend:
          replicas: 1
          
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
