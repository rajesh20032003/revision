apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
spec:
  project: default
  source:
    # FIX: Point directly to the new official community Helm Chart repository
    repoURL: https://grafana-community.github.io/helm-charts
    chart: loki
    targetRevision: "6.55.0" # This is the final ultra-stable OSS version from this release line
    helm:
      values: |
        deploymentMode: SimpleScalable
        loki:
          auth_enabled: false
          commonConfig:
            replication_factor: 1
          
          # Explicit mapping layout structure matching Loki 3.x schema requirements
          schemaConfig:
            configs:
              - from: "2024-04-01"
                object_store: s3
                store: tsdb
                schema: v13
                index:
                  prefix: index_
                  period: 24h

          storage:
            type: s3
            bucketNames:
              chunks: s3-loki-bucket-rajesh
              ruler: s3-loki-bucket-rajesh
              admin: s3-loki-bucket-rajesh
            s3:
              region: us-east-1
              s3ForcePathStyle: false
              secretName: loki-s3-secret
        
        # Optimize resource footprints on your single node testing environment
        read:
          replicas: 1
        write:
          replicas: 1
        backend:
          replicas: 1
          
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
