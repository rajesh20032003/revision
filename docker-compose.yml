version: "3.9"

services:
  product-service:
    build: ./services/product-service
    ports:
      - "8081:8080"
    environment:
      - PORT=8080

  user-service:
    build: ./services/user-service
    ports:
      - "8082:8080"
    environment:
      - PORT=8080

  cart-service:
    build: ./services/cart-service
    ports:
      - "8083:8080"
    environment:
      - PORT=8080
      - PRODUCT_SERVICE_URL=http://product-service:8080
    depends_on:
      - product-service

  order-service:
    build: ./services/order-service
    ports:
      - "8084:8080"
    environment:
      - PORT=8080
      - USER_SERVICE_URL=http://user-service:8080
      - CART_SERVICE_URL=http://cart-service:8080
    depends_on:
      - user-service
      - cart-service

  gateway:
    build: ./services/gateway
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - PRODUCT_SERVICE_URL=http://product-service:8080
      - USER_SERVICE_URL=http://user-service:8080
      - CART_SERVICE_URL=http://cart-service:8080
      - ORDER_SERVICE_URL=http://order-service:8080
    depends_on:
      - product-service
      - user-service
      - cart-service
      - order-service
