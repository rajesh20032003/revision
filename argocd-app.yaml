apiVersion: argoproj.io/v1alpha1
kind: Application 
metadata:
  name: pg-shop
  namespace: argocd 
spec:
  project: default 
  source:
    repoURL: "https://github.com/rajesh20032003/revision"
    targetRevision: HEAD 
    path: k8s 
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: shop
  syncPolicy:
    automated:
      prune: true 
      selfHeal: true 